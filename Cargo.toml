[workspace]
resolver = "2"
members = [
  "crates/soroban-test-kit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Akinyemi04/soroban-test-kit"

[workspace.dependencies]
# Pinned to match the rest of the ecosystem (soroban-amm, stellarspend-contracts).
soroban-sdk = { version = "21.7.7" }

[profile.release]
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false
overflow-checks = true
lto = true
panic = "abort"
codegen-units = 1
