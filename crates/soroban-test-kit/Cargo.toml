[package]
name = "soroban-test-kit"
description = "Reusable mocks, assertions, and fuzzing harnesses for testing Soroban smart contracts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `testutils` is off by default so the crate (and its wasm build) compiles
# without it. `#[cfg(test)]` modules get it from [dev-dependencies] below;
# consumers only need to enable it themselves for opt-in helpers like
# `asserts::panics::assert_panics`.
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
