[package]
name = "soroban-test-kit"
description = "Reusable mocks, assertions, and fuzzing harnesses for testing Soroban smart contracts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Mocks are real Soroban contracts, so consumers register them in their own
# test environments. They require the SDK testutils.
default = ["testutils"]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
